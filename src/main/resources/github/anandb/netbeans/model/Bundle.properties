# HarnessCatalog localization

# Shown as the model dropdown tooltip when the harness cannot change models at runtime
MSG_UnsupportedModelSelection=Model needs to be specified as a command line parameter and needs an IDE restart
MSG_OpenClawUnsupportedModelSelection=Change the model within the chat session with: /acp set model provider/model\n(for example: /acp set model opencode-go/glm-5.3-flash)
MSG_OpenClawUnsupportedModelSelectionPlaceholder=Set model via /acp
MSG_GeminiUnsupportedModelSelectionPlaceholder=specify model via the --model argument to the server
MSG_OpenHandsUnsupportedModelSelection=Configure the model in the OpenHands CLI (run openhands, or launch with --override-with-envs); it cannot be changed in the session
MSG_OpenHandsUnsupportedModelSelectionPlaceholder=set model in the OpenHands CLI

# What a partially supported harness cannot do (shown in the onboarding chooser and Options)
Harness.Limitations.OpenClaw=No model switching, session list, or agent list.
Harness.Limitations.Jcode=No MCP tools, session list, or agent list. Replayed responses appear as separate bubbles.
Harness.Limitations.Gemini=No model switching (set --model in Process Arguments) and no session list.
Harness.Limitations.Cline=No MCP tools or session list.
Harness.Limitations.Pi=MCP tools need the pi-mcp-adapter package.
Harness.Limitations.OpenHands=No model switching (configure it in the OpenHands CLI), no session list, no plugin MCP tools, and reloaded sessions omit your own messages.
