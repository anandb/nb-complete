# ACPOptionsPanel tooltips
TT_ExecutablePath=Full Path to the Agent Server Binary. If Left Blank, the Plugin Waits Until You Pick One Through the Onboarding Choice. Use Browse... to Pick a Binary. Invalid Paths Show a Validation Error.
TT_BrowseExecutable=Opens a file chooser to select the agent executable.
TT_ProcessArguments=Extra command-line arguments passed when launching the agent server process. Default: acp.
TT_CheckForUpdates=Enables the background Update Checker Service, which queries for new releases at randomised intervals between 16 and 24 hours. When an update is found you can download it immediately, get reminded later, or skip that version.
TT_EchoInput=Renders your message instantly in the chat while the server is processing, instead of waiting for the first response.
TT_SessionIdleTimeout=How long (0-3600, step 5) a request may sit idle - with no data arriving from the server - before it is failed. This is an idle timeout, not an absolute deadline, so long-running responses that keep streaming are never cut off.
TT_CombineToolThought=Groups tool outputs and reasoning into one expandable header instead of separate bubbles. Changing this reloads the current session.
TT_AutoBackupChanges=Stashes uncommitted changes in git/hg repositories before each turn, so the AI can be rolled back safely. Experimental.
TT_MaxMessages=The maximum number of visible bubbles (10-200, step 5) kept in the chat panel before older ones are trimmed from the view to conserve memory. The full history remains on the server and can be reloaded.
TT_SortLines=Adds the Sort Lines Ascending and Sort Lines Descending items to the editor's right-click context menu.
TT_CompactJson=Adds the Minify JSON item to the editor's right-click context menu for stripping formatting whitespace from JSON.
TT_SearchWeb=Adds the Search Web item to the editor's right-click context menu for searching the selected text (or the word under the cursor) on Google.
TT_ShowAnnotations=Adds the Toggle Annotations item to the editor's right-click context menu for toggling the versioning system's blame annotations.
TT_ViewFileHistory=Adds the View File History item to the editor's right-click context menu for opening the versioning system's history view.
TT_StashDiff=Enables the Stash Diff toolbar button and the Ctrl+Shift+L action for viewing git stash diffs.
TT_QuickJump=Enables the Jump to File dialog, a quick way to open any file in the project. A shortcut (e.g. Ctrl+Alt+J) is shown next to the label when one is available.
TT_EnableMiniAssistant=Decides where Send to Assistant / Ask Assistant actions open: the floating mini dialog (enabled) or the main sidebar (disabled).
TT_EnableTaskRepository=Enables the Task Repository feature backed by todo.txt files. When disabled, task repositories are not restored at startup and the Tasks Dashboard will not show BeanBot tasks.
TT_EnableMarkdownProject=Enables the Markdown project type. When enabled, any folder containing an empty .mdproject marker file can be opened as a NetBeans project. When disabled, such folders are not recognised as projects. Takes effect on newly opened projects.
TT_UserIcon=Path to a PNG used as your avatar in chat. Click Browse... to pick one, or right-click the preview to clear it. Changing it reloads the session.
TT_ToolbarIconSize=Icon size for the assistant toolbar: 16, 24, 28, 32, 36, 40, or 48. Requires an IDE restart to apply.
TT_ChatFontSize=Font size for chat text: Inherited (uses the theme), or 10, 11, 12, 13, 14, 16.
TT_PreambleEnabled=When enabled, the startup prompt (critical rules, WSL guidance, and the session preamble)\nis sent as the first user message for new chats. When disabled, no startup prompt is sent.
LBL_PreambleEnabled=Enable Session Preamble
