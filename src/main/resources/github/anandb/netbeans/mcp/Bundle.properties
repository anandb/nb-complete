# EditorToolProvider
DESC_FilePath=Absolute path to the file to open
DESC_LineNumber=Line number to navigate to (1-indexed)
DESC_Focus=True only when the user explicitly asked to be taken to this location ("show me where...", "take me to line X"). False (default) opens the editor in the background without taking focus - use it for navigation you initiate while reading or writing files.
