<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14181b"/>
      <stop offset="1" stop-color="#1d2428"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#359a9a"/>
      <stop offset="1" stop-color="#2a7d7d"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="90"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <ellipse cx="1080" cy="300" rx="320" ry="260" fill="#2f8a8a" opacity="0.08" filter="url(#glow)"/>

  <!-- Logo -->
  <g transform="translate(96,72) scale(4.5)">
    <path d="M3 1.5 H13 A2.5 2.5 0 0 1 15.5 4 V10 A2.5 2.5 0 0 1 13 12.5 H6.8 L3.6 15.2 L3.9 12.5 H3 A2.5 2.5 0 0 1 0.5 10 V4 A2.5 2.5 0 0 1 3 1.5 Z" fill="url(#accent)"/>
    <circle cx="5" cy="2.2" r="0.9" fill="#ffffff"/>
    <circle cx="8" cy="2.2" r="0.9" fill="#cfe8e8"/>
    <circle cx="11" cy="2.2" r="0.9" fill="#9fd2d2"/>
    <path d="M5.6 5.5 L3.9 7.5 L5.6 9.5 M10.4 5.5 L12.1 7.5 L10.4 9.5 M8.7 4.8 L7.3 10.2"
          fill="none" stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="190" y="116" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="46"
        font-weight="700" fill="#ffffff">BeanBot</text>
  <text x="192" y="144" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="18"
        fill="#84949b">Agentic coding inside Apache NetBeans</text>

  <rect x="96" y="214" width="64" height="4" rx="2" fill="url(#accent)"/>

  <text x="96" y="300" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="56"
        font-weight="700" fill="#ffffff">An agentic coding environment,</text>
  <text x="96" y="370" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="56"
        font-weight="700" fill="#ffffff">integrated into <tspan fill="#4fb3b3">NetBeans.</tspan></text>

  <text x="96" y="438" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="23"
        fill="#b9c4c9">Chat, tools and editor context for Claude, OpenCode, Codex,</text>
  <text x="96" y="470" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="23"
        fill="#b9c4c9">Gemini, Goose, Cursor and 13 more coding harnesses.</text>

  <line x1="96" y1="530" x2="1184" y2="530" stroke="#2b353a" stroke-width="1"/>

  <text x="96" y="572" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19"
        fill="#7f9098">19 coding harnesses</text>
  <circle cx="300" cy="566" r="2.5" fill="#359a9a"/>
  <text x="316" y="572" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19"
        fill="#7f9098">ACP</text>
  <circle cx="374" cy="566" r="2.5" fill="#359a9a"/>
  <text x="390" y="572" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19"
        fill="#7f9098">MCP</text>
  <circle cx="458" cy="566" r="2.5" fill="#359a9a"/>
  <text x="474" y="572" font-family="Inter, 'DejaVu Sans', sans-serif" font-size="19"
        fill="#7f9098">NetBeans 22+</text>
</svg>
