name: Release to Maven Central

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dryRun:
        description: 'Dry run (build and sign, but do not upload)'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

env:
  # docs/stitch.py compiles target/User Guide.twee with tweego. The runner image
  # ships python3 but not tweego, so pin and install it below.
  TWEEGO_VERSION: '2.1.1'

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Install user guide toolchain (python3 + tweego)
        run: |
          set -euo pipefail
          python3 --version
          dest="$HOME/apps/tweego"
          mkdir -p "$dest"
          curl -fsSL -o /tmp/tweego.zip \
            "https://github.com/tmedwards/tweego/releases/download/v${TWEEGO_VERSION}/tweego-${TWEEGO_VERSION}-linux-x64.zip"
          unzip -q -o /tmp/tweego.zip -d "$dest"
          chmod +x "$dest/tweego"          # the release archive stores no exec bit
          echo "$dest" >> "$GITHUB_PATH"   # stitch.py resolves tweego from PATH
          test -x "$dest/tweego"
          "$dest/tweego" --version || true # prints version + usage, then exits 1

      - name: Decode NBM keystore
        env:
          NBM_KEYSTORE_B64: ${{ secrets.NBM_KEYSTORE_B64 }}
        run: |
          if [ -n "$NBM_KEYSTORE_B64" ]; then
            echo "$NBM_KEYSTORE_B64" | base64 -d > /tmp/nb-complete-keystore.jks
          fi

      - name: Build and Deploy
        run: |
          if [ "${{ github.event.inputs.dryRun }}" == "true" ]; then
            echo "Running in dry-run mode. Skipping deployment."
            ./mvnw -B verify -P release
            # NB: use ./mvnw (pinned Maven 3.9.x), not `mvn` — Maven 3.10 writes
            # maven-metadata-local.xml into the plugin's file:// staging repo,
            # which it bundles and Central rejects ("content does NOT have a .pom
            # file"). 3.9.x writes maven-metadata-central-staging.xml, which the
            # plugin deletes before bundling.
          else
            ./mvnw -B deploy -P release
          fi
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          NBM_KEYSTORE: /tmp/nb-complete-keystore.jks
          NBM_ALIAS: ${{ secrets.NBM_ALIAS }}
          NBM_KEYPASS: ${{ secrets.NBM_KEYPASS }}

      # The antrun exec in pom.xml runs stitch.py with failonerror="false", so a
      # missing tweego only warns and the jar ships without the bundled guide.
      # Fail the release instead of publishing a build with no user guide.
      - name: Verify user guide was compiled
        run: |
          set -euo pipefail
          guide="target/generated-guide/UserGuide.html"
          test -s "$guide"
          grep -q '<!DOCTYPE html>' "$guide"
          ls -l "$guide"
